<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Drakon Rhym</title>
    <style>
      :root {
        --bg: #0a1428;
        --card: #11233b;
        --card-border: #1f3a5a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --primary: #1f9d4d;
        --primary-hover: #178a40;
        --status: #22c55e;
        --status-bg: rgba(34, 197, 94, 0.15);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 11px;
        width: 264px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 9px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        border: 1px solid var(--card-border);
        background: #ffffff;
        object-fit: cover;
        object-position: center 38%;
        flex-shrink: 0;
      }
      .title {
        flex: 1;
        min-width: 0;
        font-size: 13.5px;
        font-weight: 700;
        color: #7dd3fc;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--status-bg);
        color: var(--status);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        flex-shrink: 0;
      }
      .status-pill::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--status);
      }
      .lang-wrap { position: relative; flex-shrink: 0; }
      .icon-btn {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--card);
        border: 1px solid var(--card-border);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex-shrink: 0;
      }
      .icon-btn:hover, .icon-btn[aria-expanded="true"] {
        background: #18334f;
        border-color: var(--accent);
        color: var(--accent);
      }
      .lang-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 130px;
        background: #14283f;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        z-index: 10;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      }
      .lang-menu[hidden] { display: none; }
      .lang-item {
        background: transparent;
        color: var(--text);
        border: none;
        text-align: left;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
      }
      .lang-item:hover { background: rgba(56, 189, 248, 0.1); }
      .lang-item.active { color: var(--accent); }
      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 11px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .current-tone {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .current-tone .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 700;
      }
      .current-tone .value {
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .current-tone .unit {
        font-size: 12px;
        color: var(--muted);
        margin-left: 2px;
        font-weight: 600;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        margin: 2px 0 8px;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px;
        background: linear-gradient(
          to right,
          var(--card-border) 0%,
          var(--card-border) var(--fill-start, 50%),
          var(--accent) var(--fill-start, 50%),
          var(--accent) var(--fill-end, 50%),
          var(--card-border) var(--fill-end, 50%),
          var(--card-border) 100%
        );
        border-radius: 999px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: -5px;
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
        cursor: pointer;
      }
      .scale {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .scale .center {
        text-align: center;
        color: var(--accent);
        text-transform: uppercase;
      }
      .scale .right { text-align: right; }
      .quick-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-top: 10px;
      }
      .quick-btn {
        background: transparent;
        color: #7dd3fc;
        border: 1px solid var(--card-border);
        border-radius: 7px;
        padding: 6px 0;
        font-weight: 700;
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
      }
      .quick-btn:hover { background: rgba(56, 189, 248, 0.08); }
      .action-btn {
        width: 100%;
        padding: 9px;
        border-radius: 10px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--card-border);
        font-family: inherit;
      }
      .action-btn.secondary {
        background: var(--card);
        color: var(--text);
      }
      .action-btn.secondary:hover { background: #17304b; }
      .action-btn.primary {
        background: var(--primary);
        color: #ffffff;
        border-color: transparent;
        margin-top: 8px;
      }
      .action-btn.primary:hover { background: var(--primary-hover); }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 20, 40, 0.96);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .overlay[hidden] { display: none; }
      .overlay-card {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 18px 16px 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
      }
      .overlay-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .overlay-text {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--text);
      }
      .overlay-action {
        background: #f59e0b;
        color: #0a1428;
        border: none;
        border-radius: 9px;
        padding: 9px 20px;
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        font-family: inherit;
        margin-top: 2px;
      }
      .overlay-action:hover { background: #d97706; }
    </style>
  </head>
  <body>
    <div class="header">
      <img id="avatar" class="avatar" alt="" />
      <h1 class="title">Drakon Rhym</h1>
      <span class="status-pill"><span data-i18n="uiStatusActive">Đang bật</span></span>
      <div class="lang-wrap">
        <button
          class="icon-btn"
          id="langToggle"
          type="button"
          data-i18n-title="uiLangTitle"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Ngôn ngữ"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox" hidden>
          <button class="lang-item" type="button" data-lang="en">English</button>
          <button class="lang-item" type="button" data-lang="vi">Tiếng Việt</button>
          <button class="lang-item" type="button" data-lang="ja">日本語</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="refreshBanner" hidden role="alertdialog" aria-modal="true">
      <div class="overlay-card">
        <div class="overlay-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <p class="overlay-text" data-i18n="uiNeedsRefresh">Hãy refresh tab này để bắt đầu sử dụng extension.</p>
        <button class="overlay-action" id="refreshTab" type="button" data-i18n="uiRefreshButton">Tải lại</button>
      </div>
    </div>

    <div class="card current-tone">
      <span class="label" data-i18n="uiCurrentPitch">Tone hiện tại</span>
      <div>
        <span class="value" id="toneValue">0.0</span><span class="unit">st</span>
      </div>
    </div>

    <div class="card">
      <input id="pitch" type="range" min="-6" max="6" step="0.1" value="0" />
      <div class="scale">
        <span>-6 ST</span>
        <span class="center" data-i18n="uiOriginal">Gốc</span>
        <span class="right">+6 ST</span>
      </div>
      <div class="quick-row">
        <button class="quick-btn" data-delta="-1" type="button">[-1]</button>
        <button class="quick-btn" data-delta="-0.5" type="button">[-0.5]</button>
        <button class="quick-btn" data-delta="0.5" type="button">[+0.5]</button>
        <button class="quick-btn" data-delta="1" type="button">[+1]</button>
      </div>
    </div>

    <button class="action-btn secondary" id="reset" type="button">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      <span data-i18n="uiResetTone">Đặt lại tone</span>
    </button>
    <button class="action-btn primary" id="exportMp3" type="button" data-i18n="uiExportMp3">Xuất MP3</button>

    <script src="popup-simple.js"></script>
  </body>
</html>
